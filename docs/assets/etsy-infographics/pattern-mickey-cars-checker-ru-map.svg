<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" lang="ru" role="img"><title>Дизайн и пропорции</title><desc>Векторная схема по предоставленным файлам проекта. Размеры в пикселях — не размеры печати.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#536257" stroke-width="1.5"/></marker></defs><rect width="1240" height="900" fill="#faf8f3"/><g font-family="Arial, sans-serif"><text x="68" y="52" font-size="16" fill="#a24d27" letter-spacing="2">ИНФОГРАФИКА</text><text x="68" y="112" font-size="42" fill="#222" font-weight="600">Микки в машинках</text><text x="68" y="221" font-size="28" fill="#536257" >Дизайн и пропорции</text><text x="68" y="258" font-size="20" fill="#595959" >Полный дизайн без обрезки</text><rect x="447.5" y="342" width="345" height="345" rx="2" fill="#e8e3d9" stroke="#536257" stroke-width="2"/><image href="data:image/webp;base64," x="447.5" y="342" width="345" height="345" preserveAspectRatio="xMidYMid meet"/><line x1="447.5" y1="318" x2="792.5" y2="318" stroke="#536257" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="620" y="302" font-size="21" fill="#536257" text-anchor="middle">3600 px</text><text x="620" y="730" font-size="23" fill="#222" text-anchor="middle" font-weight="600">3600 × 3600 px</text><text x="68" y="759" font-size="18" fill="#595959" >Пропорции исходного файла · 1 : 1</text><path d="M68 800H1172" stroke="#d8d2c7"/><text x="68" y="840" font-size="19" fill="#595959" >Пиксели веб-файла, не печатного исходника и не физические размеры печати.</text></g></svg>